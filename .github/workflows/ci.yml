name: Native plugin validation

on:
  push:
    branches: [main, v0.5.0]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install .[test] build
      - run: python -m pytest tests/kernel tests/test_runtime.py tests/test_external_plugins.py tests/test_plugin_checkpoint.py
      - run: python -m build --wheel
      - name: Verify installed wheel outside the checkout
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheel = next(pathlib.Path('dist').glob('*.whl'))
          subprocess.run([sys.executable, 'tools/verify_wheel.py', str(wheel)], check=True, timeout=120)
