experiment:
  name: synthetic-cnn-smoke
  seed: 42
  runs_dir: runs

model:
  name: cnn
  input_shape: [1, 28, 28]
  channels: [8, 16]
  num_classes: 10

dataset:
  name: synthetic
  batch_size: 32
  num_workers: 0
  samples: 128
  val_samples: 64
  input_shape: [1, 28, 28]
  num_classes: 10

optimizer:
  lr: 0.001

trainer:
  epochs: 2
  device: auto
  validate_every: 1
  log_every: 2
