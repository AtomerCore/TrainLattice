profile: supervised-basic
bindings:
  org.trainlattice.experiment.default:
    model: trainlattice.model/mlp
    dataset: trainlattice.dataset/synthetic
    scheduler: trainlattice.scheduler/warmup_cosine
experiment:
  name: synthetic-mlp-efficiency
  seed: 42
  runs_dir: runs
model:
  input_dim: 784
  hidden_dims:
  - 64
  - 32
  num_classes: 10
dataset:
  batch_size: 32
  num_workers: 0
  samples: 128
  val_samples: 64
  input_shape:
  - 1
  - 28
  - 28
  num_classes: 10
optimizer:
  lr: 0.001
scheduler:
  warmup_steps: 2
  min_lr: 0.0001
trainer:
  epochs: 4
  device: auto
  validate_every: 1
  log_every: 2
  accumulate: 2
  precision: bf16
  early_stopping:
    patience: 2
    min_delta: 0.001
