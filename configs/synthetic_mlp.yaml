profile: supervised-basic
bindings:
  org.trainlattice.experiment.default:
    model: trainlattice.model/mlp
    dataset: trainlattice.dataset/synthetic
experiment:
  name: synthetic-mlp-smoke
  seed: 42
  runs_dir: runs
model:
  input_dim: 784
  hidden_dims:
  - 64
  - 32
  num_classes: 10
dataset:
  batch_size: 32
  num_workers: 0
  samples: 128
  val_samples: 64
  input_shape:
  - 1
  - 28
  - 28
  num_classes: 10
optimizer:
  lr: 0.001
trainer:
  epochs: 2
  device: auto
  validate_every: 1
  log_every: 2
