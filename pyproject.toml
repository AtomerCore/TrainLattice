[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "trainlattice"
version = "0.1.0"
description = "A lightweight and transparent deep learning training runtime."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TrainLattice contributors" }]
dependencies = [
  "PyYAML>=6.0",
  "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
trainlattice = "trainlattice.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trainlattice"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
