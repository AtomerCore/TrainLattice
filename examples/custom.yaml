experiment:
  name: two-blobs-logistic
  seed: 7
  runs_dir: runs

model:
  name: logistic
  input_dim: 2
  num_classes: 2

dataset:
  name: two_blobs
  batch_size: 16
  num_workers: 0
  input_dim: 2
  samples: 128
  val_samples: 32
  noise: 0.4

optimizer:
  lr: 0.05

trainer:
  epochs: 2
  device: cpu
  validate_every: 1
  log_every: 4
