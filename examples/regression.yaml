profile: supervised-basic
plugins:
- source: plugins/training_extensions
  config:
    metric_scale: 1.0
bindings:
  org.trainlattice.experiment.default:
    model: example.model/linear
    optimizer: example.optimizer/momentum_sgd
    scheduler: example.scheduler/exponential
    callbacks: example.callbacks/counted
    dataset: example.dataset/sine
    loss: trainlattice.loss/mse
  org.trainlattice.trainer.supervised:
    metrics: example.metrics/predictions
experiment:
  name: sine-regression
  seed: 7
  runs_dir: runs
model:
  input_dim: 1
  num_classes: 1
dataset:
  batch_size: 4
  samples: 16
  val_samples: 8
optimizer:
  lr: 0.05
  momentum: 0.9
scheduler:
  gamma: 0.9
trainer:
  epochs: 2
  device: cpu
  log_every: 1
loss: {}
