schema_version: 1
id: org.trainlattice.experiment.default
version: 0.5.0
api_version: 1
entry: plugin.py:activate
provides:
  - service: trainlattice.experiment/default
requires:
  runtime:
    service: trainlattice.runtime/local
  model:
    service: trainlattice.model/mlp
  dataset:
    service: trainlattice.dataset/synthetic
  optimizer:
    service: trainlattice.optimizer/adamw
  loss:
    service: trainlattice.loss/cross_entropy
  scheduler:
    service: trainlattice.scheduler/warmup_cosine
    optional: true
  trainer:
    service: trainlattice.trainer/supervised
  checkpoint:
    service: trainlattice.checkpoint/local
  logging:
    service: trainlattice.logging/basic
  callbacks:
    service: trainlattice.callbacks/basic
state:
  mode: stateless
